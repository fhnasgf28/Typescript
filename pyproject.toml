[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-transfer-node"
version = "0.1.0"
description = "Direct server-to-server file transfer node with Web UI and MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "mcp>=1.2.0"
]

[project.optional-dependencies]
test = [
  "httpx2>=2.4.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[project.scripts]
mcp-transfer-serve = "mcp_transfer_node.app:run"
mcp-transfer-mcp = "mcp_transfer_node.mcp_server:run"
mcp-pmt-mcp = "mcp_transfer_node.pmt_mcp_server:run"
mcp-pmt-worker = "mcp_transfer_node.pmt_worker:run"
mcp-pmt-backup = "mcp_transfer_node.pmt_backup:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

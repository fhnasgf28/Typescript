<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MCP Transfer Node - {{ settings.server_name }}</title></head><body><header><h1>MCP Transfer Node - {{ settings.server_name }}</h1><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Logout</button></form></header><main><section><h2>Upload File</h2><form method="post" action="/web/upload" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="file" type="file" required><input name="source" value="manual"><input name="note"><button>Upload</button></form></section><section><h2>Inbox</h2><table>{% for record in records %}<tr data-transfer-id="{{ record.id }}"><td>{{ record.original_filename }}</td><td>{{ record.source }}</td><td>{{ record.size_bytes }} bytes</td><td><a href="/web/files/{{ record.id }}/download">Download</a><form method="post" action="/web/files/{{ record.id }}/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Delete</button></form></td></tr>{% endfor %}</table></section></main></body></html>

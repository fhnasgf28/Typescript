services:
  pmt:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSFER_HOME_ALLOWLIST_PREFIX: /data
      MCP_TRANSFER_BASE_DIR: /data/runtime
      MCP_TRANSFER_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - pmt-data:/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pmt-worker:
    build: .
    profiles: ["worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSFER_HOME_ALLOWLIST_PREFIX: /data
      MCP_TRANSFER_BASE_DIR: /data/runtime
    command:
      - /bin/sh
      - -c
      - "while true; do python -m mcp_transfer_node.pmt_worker --worker-id docker-pmt-worker; sleep 60; done"
    volumes:
      - pmt-data:/data/runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pmt-data:
